version: 1
mode: read-only

hosts:
  - name: example-home-assistant
    hostname: ha.example.invalid
    role: home-assistant
    allowed_checks:
      - dns
      - tcp
      - http_get

  - name: example-mqtt
    hostname: mqtt.example.invalid
    role: mqtt
    allowed_checks:
      - dns
      - tcp

ssh:
  enabled: false
  future_user: homeops
  root_login: false
  arbitrary_commands: false
  dedicated_key_per_environment: true
  private_key_path: /home/homeops/.ssh/homeops_example
  allowed_scripts:
    - /usr/local/libexec/homeops/check-health
    - /usr/local/libexec/homeops/check-disk
  changes_require_owner_approval: true
  sudo_mode: fixed-command-allowlist
  rollout_order:
    - lab
    - staging
    - production
