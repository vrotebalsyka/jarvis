_config_version: 33
context_file_max_chars: 12000

model:
  default: "qwen3.5:2b-q4_K_M"
  provider: "local-ollama"
  base_url: "${HOME_BUTLER_OLLAMA_BASE_URL}/v1"
  context_length: 32768
  max_tokens: 1024

providers:
  local-ollama:
    api: "${HOME_BUTLER_OLLAMA_BASE_URL}/v1"
    transport: "chat_completions"
    default_model: "qwen3.5:2b-q4_K_M"
    context_length: 32768
    request_timeout_seconds: 180
    stale_timeout_seconds: 180
    discover_models: false
    models:
      qwen3.5:2b-q4_K_M:
        context_length: 32768
    extra_body:
      reasoning_effort: "none"

memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0
  flush_min_turns: 0

skills:
  creation_nudge_interval: 0

agent:
  max_turns: 12
  disabled_toolsets:
    - terminal
    - file
    - browser
    - cronjob
    - code_execution
    - delegation
    - homeassistant
    - web
    - search
    - skills
    - project
    - todo
    - memory
    - session_search
    - computer_use
    - image
    - video
    - tts

tools:
  tool_search:
    enabled: "off"

platform_toolsets:
  cli: [clarify, home_assistant_read]

approvals:
  mode: "manual"
  cron_mode: "deny"
  deny:
    - "systemctl *"
    - "shutdown*"
    - "reboot*"
    - "poweroff*"
    - "ha_call_service*"

mcp_servers:
  home_assistant_read:
    command: /opt/home-butler/hermes-agent/venv/bin/python
    args: ["/opt/home-butler/scripts/home_assistant_mcp.py"]
    env:
      CREDENTIALS_DIRECTORY: "${CREDENTIALS_DIRECTORY}"
      HOME_BUTLER_INVENTORY_FILE: "/home/homebutler/.local/state/home-butler/inventory.json"
    timeout: 12
    connect_timeout: 10
    sampling:
      enabled: false
